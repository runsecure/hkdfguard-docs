# Builds the site on every pull request and publishes main to the org site
# (https://runsecure.github.io) by pushing the build to runsecure/runsecure.github.io.
#
# One-time setup:
#   1. Create the public repo runsecure/runsecure.github.io and enable Pages on it
#      (Settings > Pages > Deploy from a branch > main, / (root)).
#   2. ssh-keygen -t ed25519 -C "hkdfguard-docs deploy" -f deploy_key -N ""
#   3. Add deploy_key.pub to runsecure.github.io as a deploy key with write access.
#   4. Add the contents of deploy_key to this repo as the secret ORG_SITE_DEPLOY_KEY.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ORG_SITE_DEPLOY_KEY }}
          external_repository: runsecure/runsecure.github.io
          publish_branch: main
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy from runsecure/hkdfguard-docs@${{ github.sha }}
